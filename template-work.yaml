---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 3-speckit-work
  title: Implement feature
  description: Turn the tasks of an existing feature spec into GitHub issues and implement them
  tags:
    - spec
    - workflow

spec:
  owner: group:00gjdgxs1ur6lsu
  type: component

  parameters:
    - title: Spec
      description: Feature spec to implement
      required:
        - github_org
        - component
      properties:
        github_org:
          title: GitHub Org
          type: string
          description: GitHub organization that hosts the component's repository
          default: ServerlessOpsIO
          ui:widget: hidden
        domain:
          title: Domain
          type: string
          description: Domain the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Domain
            defaultKind: Domain
        system:
          title: System
          type: string
          description: System the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
                relations.partOf: "{{ parameters.domain }}"
            defaultKind: System
        component:
          title: Component
          type: string
          description: Component the feature belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Component
                relations.partOf: "{{ parameters.system }}"
            defaultKind: Component

    - title: Work
      required:
        - spec
        - github_auth
      properties:
        spec:
          title: Spec
          type: string
          description: Feature spec to implement. Its plan and tasks must be merged.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: doc-spec
                relations.dependsOn: "{{ parameters.component }}"
            defaultKind: Resource
        add_implement_prompt:
          title: Add implementation instructions
          type: boolean
          description: Give Copilot extra instructions for the implementation
          default: false
        github_auth:
          type: string
          ui:field: SoRequestUserCredentials
          ui:options:
            host: github.com
            requestUserCredentials:
              secretsKey: USER_GITHUB_TOKEN
              additionalScopes:
                github:
                  - read:user
      # Shows the instructions field only when add_implement_prompt is checked.
      dependencies:
        add_implement_prompt:
          oneOf:
            - properties:
                add_implement_prompt:
                  enum: [false]
            - properties:
                add_implement_prompt:
                  enum: [true]
                speckit_implement_prompt:
                  title: Implementation instructions
                  type: string
                  description: Instructions for the implementation, such as which tasks to work on
                  ui:widget: textarea
                  ui:options:
                    rows: 2

  steps:
    - id: fetch-spec
      name: Fetch spec
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.spec }}

    - id: clone
      name: Clone component repository
      action: x_github:clone
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: speckit-workflow
      name: Create task issues, implement, and create work branch
      action: github:speckit:workflow
      input:
        workflow: |
          schema_version: "1.0"
          workflow:
            id: taskstoissues-implement-branch
            name: Tasks to issues, implement, and create work branch
            version: 1.0.0
            description: Runs taskstoissues and implement for an existing feature, then creates a work/<spec directory name> branch

          inputs:
            feature_directory:
              type: string
              required: true
            implement:
              type: string
              required: false
              default: ""

          steps:
            # .specify/feature.json isn't committed, so record the feature
            # directory for the commands to work on. Implementing needs the
            # merged tasks from the plan template.
            - id: feature
              type: shell
              run: |
                set -eu
                feature_dir="{{ inputs.feature_directory }}"
                test -f "$feature_dir/tasks.md"
                mkdir -p .specify
                printf '{\n  "feature_directory": "%s"\n}\n' "$feature_dir" > .specify/feature.json
                echo "Implementing $feature_dir"

            # Created first, so the issues are made from the tasks as planned.
            - id: taskstoissues
              command: speckit.taskstoissues
              integration: copilot

            - id: implement
              command: speckit.implement
              integration: copilot
              input:
                args: "{{ inputs.implement }}"

            - id: branch
              type: shell
              run: |
                set -eu
                spec_dir_name=$(basename "{{ inputs.feature_directory }}")
                git checkout -b "work/$spec_dir_name"
                echo "Created branch work/$spec_dir_name"
        inputs:
          feature_directory: ${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}
          implement: ${{ parameters.speckit_implement_prompt if parameters.add_implement_prompt else '' }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: commit-work
      name: Commit implementation
      action: x_github:commit
      input:
        commitMessage: "Implement: ${{ steps['fetch-spec'].output.entity.metadata.title }}"
        gitAuthorName: ${{ user.entity.spec.profile.displayName }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}

    - id: push-work-branch
      name: Push work branch
      action: x_github:push
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        branch: work/${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'].split('/') | last }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: open-work-pr
      name: Open draft implementation pull request
      action: x_github:pr:create
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        head: ${{ steps['push-work-branch'].output.branch }}
        title: "Implement: ${{ steps['fetch-spec'].output.entity.metadata.title }}"
        description: "Implementation of the tasks in `${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}/tasks.md`."
        draft: true
        labels:
          - work
          # The spec directory name, such as 001-github-speckit-init.
          - "${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'].split('/') | last }}"
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

  output:
    links:
      - title: Implementation pull request
        icon: github
        url: ${{ steps['open-work-pr'].output.pullRequestUrl }}
      - title: Task issues
        icon: github
        url: https://github.com/${{ parameters.github_org }}/${{ parameters.component | parseEntityRef | pick('name') }}/issues
      - title: Spec in catalog
        icon: catalog
        entityRef: ${{ parameters.spec }}
      - title: Component in catalog
        icon: catalog
        entityRef: ${{ parameters.component }}
