---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 2-speckit-plan
  title: Create feature plan
  description: Create an implementation plan for an existing feature spec of a software component
  tags:
    - spec
    - workflow

spec:
  owner: group:00gjdgxs1ur6lsu
  type: component

  parameters:
    - title: Spec
      description: Feature spec to plan
      required:
        - github_org
        - component
        - spec
      properties:
        github_org:
          title: GitHub Org
          type: string
          description: GitHub organization that hosts the component's repository
          default: ServerlessOpsIO
          ui:widget: hidden
        domain:
          title: Domain
          type: string
          description: Domain the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Domain
            defaultKind: Domain
        system:
          title: System
          type: string
          description: System the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
                relations.partOf: "{{ parameters.domain }}"
            defaultKind: System
        component:
          title: Component
          type: string
          description: Component the feature belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Component
                relations.partOf: "{{ parameters.system }}"
            defaultKind: Component
        # Specs appear in the catalog once their spec pull request is merged.

    - title: Plan
      required:
        - spec
        - speckit_plan
        - github_auth
      properties:
        spec:
          title: Spec
          type: string
          description: Feature spec to create the plan for.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: doc-spec
                relations.dependsOn: "{{ parameters.component }}"
            defaultKind: Resource
        speckit_plan:
          title: Technical guidance
          type: string
          description: Optional technology choices or constraints for the implementation plan
          ui:widget: textarea
          ui:options:
            rows: 12
        github_auth:
          type: string
          ui:field: SoRequestUserCredentials
          ui:options:
            host: github.com
            requestUserCredentials:
              secretsKey: USER_GITHUB_TOKEN
              additionalScopes:
                github:
                  - read:user

  steps:
    - id: fetch-spec
      name: Fetch spec
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.spec }}

    - id: clone
      name: Clone component repository
      action: x_github:clone
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: speckit-workflow
      name: Create plan, checklist, tasks, and plan branch
      action: github:speckit:workflow
      input:
        workflow: |
          schema_version: "1.0"
          workflow:
            id: plan-checklist-tasks-branch
            name: Plan, checklist, tasks, and create plan branch
            version: 1.0.0
            description: Runs plan, checklist, and tasks for an existing feature, then creates a plan/<spec directory name> branch

          inputs:
            feature_directory:
              type: string
              required: true
            plan:
              type: string
              required: false
              default: ""

          steps:
            # .specify/feature.json isn't committed, so record the feature
            # directory for plan to work on.
            - id: feature
              type: shell
              run: |
                set -eu
                feature_dir="{{ inputs.feature_directory }}"
                test -f "$feature_dir/spec.md"
                mkdir -p .specify
                printf '{\n  "feature_directory": "%s"\n}\n' "$feature_dir" > .specify/feature.json
                echo "Planning $feature_dir"

            - id: plan
              command: speckit.plan
              integration: copilot
              input:
                args: "{{ inputs.plan }}"

            - id: checklist
              command: speckit.checklist
              integration: copilot

            - id: tasks
              command: speckit.tasks
              integration: copilot

            - id: branch
              type: shell
              run: |
                set -eu
                spec_dir_name=$(basename "{{ inputs.feature_directory }}")
                git checkout -b "plan/$spec_dir_name"
                echo "Created branch plan/$spec_dir_name"
        inputs:
          feature_directory: ${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}
          plan: ${{ parameters.speckit_plan | default('') }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: commit-plan
      name: Commit plan changes
      action: x_github:commit
      input:
        commitMessage: "Add plan: ${{ steps['fetch-spec'].output.entity.metadata.title }}"
        gitAuthorName: ${{ user.entity.spec.profile.displayName }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}

    - id: push-plan-branch
      name: Push plan branch
      action: x_github:push
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        branch: plan/${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'].split('/') | last }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: open-plan-pr
      name: Open draft plan pull request
      action: x_github:pr:create
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        head: ${{ steps['push-plan-branch'].output.branch }}
        title: "Plan: ${{ steps['fetch-spec'].output.entity.metadata.title }}"
        description: ${{ parameters.speckit_plan | default('Implementation plan for ' + steps['fetch-spec'].output.entity.metadata.title, true) }}
        draft: true
        labels:
          - plan
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: analyze-plan
      name: Ask Copilot to analyze the plan
      action: x_github:pr:comment
      input:
        repoUrl: github.com?repo=${{ parameters.component | parseEntityRef | pick('name') }}&owner=${{ parameters.github_org }}
        pullRequestNumber: ${{ steps['open-plan-pr'].output.pullRequestNumber }}
        # .specify/feature.json isn't committed, so name the spec directory for
        # Spec Kit explicitly.
        body: |
          @copilot run the /speckit-analyze skill. Then take all the findings you come up with and put them in a PR comment.

          DO NOT START IMPLEMENTATION.

          The spec for this pull request is `${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}/spec.md`, with its plan and tasks in the feature directory `${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}`. Set `SPECIFY_FEATURE_DIRECTORY=${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}` when running Spec Kit so it works on this feature.
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

  output:
    links:
      - title: Plan pull request
        icon: github
        url: ${{ steps['open-plan-pr'].output.pullRequestUrl }}
      - title: Plan on GitHub
        icon: github
        url: https://github.com/${{ parameters.github_org }}/${{ parameters.component | parseEntityRef | pick('name') }}/blob/${{ steps['push-plan-branch'].output.branch }}/${{ steps['fetch-spec'].output.entity.metadata.annotations['serverlessops.io/spec-dir'] }}/plan.md
      - title: Spec in catalog
        icon: catalog
        entityRef: ${{ parameters.spec }}
      - title: Component in catalog
        icon: catalog
        entityRef: ${{ parameters.component }}
